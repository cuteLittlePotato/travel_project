[project]
name = "travel-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "bcrypt>=5.0.0",
    "celery>=5.4",
    "elasticsearch[async]>=8.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "kombu>=5.7.0",
    "minio>=7.2.20",
    "neo4j>=5.0",
    "orjson>=3.13.0",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.9",
    "pymilvus>=3.0.2",
    "python-multipart>=0.0.33",
    "redis>=5.0",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"backend/app/db/migrations/versions/*" = ["E", "F", "I", "UP"]
# FastAPI 的依赖注入要求 Depends() 写在参数默认值里，B008 在此场景为误报。
# 对所有 Python 文件生效：项目内任何 FastAPI 端点或测试桩都会用到该写法。
"backend/**/*.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
# asyncpg 连接池与事件循环绑定，整个测试会话复用同一个 loop
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
pythonpath = ["backend"]
filterwarnings = ["ignore::DeprecationWarning:starlette.testclient"]
markers = [
    "integration: 需要真实外部服务（PostgreSQL 等），无配置时自动跳过",
    "destructive: 会清空数据库（DROP SCHEMA），必须显式 --run-destructive 才执行",
]
