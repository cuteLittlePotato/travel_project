[alembic]
script_location = app/db/migrations
prepend_sys_path = .
version_path_separator = os
# Timestamp prefix keeps migration files ordered by execution
file_template = %%(year)d%%(month).2d%%(day).02d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
# URL is read from app.core.config, never hardcoded here

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
