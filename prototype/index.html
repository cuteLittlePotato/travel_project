<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>云游坊 - 原型导航</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 60px;
            max-width: 800px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
            font-size: 48px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 50px;
            font-size: 18px;
        }

        .nav-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 30px;
            margin-bottom: 40px;
        }

        .nav-card {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 15px;
            padding: 40px 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            color: #333;
            position: relative;
            overflow: hidden;
        }

        .nav-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 0;
        }

        .nav-card:hover::before {
            opacity: 1;
        }

        .nav-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .nav-card:hover .nav-title,
        .nav-card:hover .nav-desc {
            color: white;
        }

        .nav-title {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 15px;
            position: relative;
            z-index: 1;
            transition: color 0.3s ease;
        }

        .nav-desc {
            font-size: 14px;
            color: #666;
            line-height: 1.6;
            position: relative;
            z-index: 1;
            transition: color 0.3s ease;
        }

        .info {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-top: 30px;
        }

        .info h3 {
            color: #333;
            margin-bottom: 10px;
            font-size: 18px;
        }

        .info ul {
            list-style: none;
            padding-left: 0;
        }

        .info li {
            color: #666;
            padding: 5px 0;
            font-size: 14px;
        }

        .info li::before {
            content: "✓ ";
            color: #667eea;
            font-weight: bold;
            margin-right: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>云游坊</h1>
        <p class="subtitle">旅游推荐与规划系统 - 交互原型</p>

        <div class="nav-grid">
            <a href="c-end/home.html" class="nav-card">
                <div class="nav-title">C 端用户</div>
                <div class="nav-desc">面向普通旅游用户<br>景点浏览、智能规划、足迹管理</div>
            </a>

            <a href="b-end/dashboard.html" class="nav-card">
                <div class="nav-title">B 端后台</div>
                <div class="nav-desc">面向运营人员<br>数据管理、用户管理、数据看板</div>
            </a>
        </div>

        <div class="info">
            <h3>📋 原型说明</h3>
            <ul>
                <li>本原型基于《requirements.md》需求文档设计</li>
                <li>仅展示页面交互效果，不包含后端逻辑</li>
                <li>支持响应式布局，适配移动端和桌面端</li>
                <li>使用纯 HTML/CSS/JS 实现，无框架依赖</li>
            </ul>
        </div>
    </div>
</body>
</html>
