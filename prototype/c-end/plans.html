<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的计划 - 云游坊</title>
    <link rel="stylesheet" href="../css/common.css">
    <style>
        .plans-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .page-title {
            font-size: 32px;
            font-weight: bold;
            color: #333;
        }

        .status-tabs {
            display: flex;
            gap: 16px;
            margin-bottom: 30px;
            border-bottom: 2px solid #e8e8e8;
        }

        .status-tab {
            padding: 12px 24px;
            background: transparent;
            border: none;
            font-size: 16px;
            color: #666;
            cursor: pointer;
            position: relative;
            transition: all 0.3s;
        }

        .status-tab.active {
            color: #667eea;
            font-weight: bold;
        }

        .status-tab.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .plans-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 24px;
        }

        .plan-card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            transition: all 0.3s;
            cursor: pointer;
        }

        .plan-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.12);
        }

        .plan-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 16px;
        }

        .plan-title {
            font-size: 20px;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }

        .plan-status {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
        }

        .status-planning {
            background: #fff3e0;
            color: #f57c00;
        }

        .status-pending {
            background: #e3f2fd;
            color: #1976d2;
        }

        .status-ongoing {
            background: #e8f5e9;
            color: #388e3c;
        }

        .status-completed {
            background: #f5f5f5;
            color: #757575;
        }

        .plan-meta {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 16px;
            font-size: 14px;
            color: #666;
        }

        .plan-meta-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .plan-actions {
            display: flex;
            gap: 8px;
            padding-top: 16px;
            border-top: 1px solid #f0f0f0;
        }

        .plan-actions .btn {
            flex: 1;
            padding: 8px 16px;
            font-size: 13px;
        }

        .empty-state {
            text-align: center;
            padding: 80px 20px;
        }

        .empty-state h3 {
            font-size: 20px;
            color: #999;
            margin-bottom: 12px;
        }

        .empty-state p {
            color: #bbb;
            margin-bottom: 24px;
        }

        /* 计划编辑模态框 - 加大尺寸 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-y: auto;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 12px;
            padding: 32px;
            max-width: 900px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 24px;
            color: #333;
        }

        .form-section {
            margin-bottom: 32px;
            padding-bottom: 24px;
            border-bottom: 1px solid #f0f0f0;
        }

        .form-section:last-of-type {
            border-bottom: none;
        }

        .section-title {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }

        .form-input, .form-textarea, .form-select {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
        }

        .form-textarea {
            min-height: 100px;
            resize: vertical;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .form-row-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 16px;
        }

        /* 每日行程编辑器 */
        .days-editor {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
        }

        .day-item {
            background: white;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 16px;
        }

        .day-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 2px solid #f0f0f0;
        }

        .day-title {
            font-size: 16px;
            font-weight: bold;
            color: #333;
        }

        .add-activity-btn {
            padding: 6px 16px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .add-activity-btn:hover {
            background: #5568d3;
        }

        .activity-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .activity-item {
            background: #f8f9fa;
            border-radius: 6px;
            padding: 16px;
            border-left: 3px solid #667eea;
            position: relative;
        }

        .activity-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 12px;
        }

        .activity-time {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .activity-time input {
            padding: 6px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 13px;
            width: 100px;
        }

        .activity-actions {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            width: 28px;
            height: 28px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: all 0.3s;
        }

        .icon-btn-delete {
            background: #ffebee;
            color: #d32f2f;
        }

        .icon-btn-delete:hover {
            background: #d32f2f;
            color: white;
        }

        .activity-content {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 12px;
        }

        .activity-type {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 13px;
        }

        .activity-desc {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 13px;
            font-family: inherit;
            resize: none;
        }

        .empty-activities {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid #e8e8e8;
        }

        .form-actions .btn {
            flex: 1;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .plans-grid {
                grid-template-columns: 1fr;
            }

            .page-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 16px;
            }

            .form-row,
            .form-row-3 {
                grid-template-columns: 1fr;
            }

            .activity-content {
                grid-template-columns: 1fr;
            }

            .modal-content {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="navbar-container">
            <a href="home.html" class="logo">云游坊</a>
            <ul class="nav-menu">
                <li><a href="home.html">首页</a></li>
                <li><a href="plans.html" class="active">我的计划</a></li>
                <li><a href="footprints.html">足迹</a></li>
                <li><a href="discover.html">发现</a></li>
            </ul>
            <div class="user-menu">
                <div class="avatar" onclick="window.location.href='profile.html'">游</div>
            </div>
        </div>
    </nav>

    <div class="plans-container">
        <div class="page-header">
            <h1 class="page-title">我的旅游计划</h1>
            <button class="btn btn-primary" onclick="openNewPlanModal()">+ 新建计划</button>
        </div>

        <div class="status-tabs">
            <button class="status-tab active" data-status="all" onclick="filterByStatus('all')">全部</button>
            <button class="status-tab" data-status="planning" onclick="filterByStatus('planning')">规划中</button>
            <button class="status-tab" data-status="pending" onclick="filterByStatus('pending')">待进行</button>
            <button class="status-tab" data-status="ongoing" onclick="filterByStatus('ongoing')">进行中</button>
            <button class="status-tab" data-status="completed" onclick="filterByStatus('completed')">已完成</button>
        </div>

        <div class="plans-grid" id="plansGrid"></div>
    </div>

    <!-- 编辑计划模态框 -->
    <div class="modal" id="planModal">
        <div class="modal-content">
            <div class="modal-header" id="modalTitle">新建旅游计划</div>

            <form onsubmit="savePlan(event)">
                <!-- 基本信息 -->
                <div class="form-section">
                    <div class="section-title">📋 基本信息</div>
                    <div class="form-group">
                        <label class="form-label">计划标题</label>
                        <input type="text" class="form-input" id="planTitle" placeholder="例如：北京历史文化3日游" required>
                    </div>
                    <div class="form-row-3">
                        <div class="form-group">
                            <label class="form-label">目的地</label>
                            <input type="text" class="form-input" id="planDestination" placeholder="例如：北京" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">同行人数</label>
                            <input type="number" class="form-input" id="planPeople" placeholder="人数" value="1" min="1" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">预算（元）</label>
                            <input type="number" class="form-input" id="planBudget" placeholder="例如：3000" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">出发日期</label>
                            <input type="date" class="form-input" id="planStartDate" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">结束日期</label>
                            <input type="date" class="form-input" id="planEndDate" required>
                        </div>
                    </div>
                </div>

                <!-- 每日行程安排 -->
                <div class="form-section">
                    <div class="section-title">🗓️ 每日行程安排</div>
                    <div class="days-editor" id="daysEditor">
                        <p style="text-align: center; color: #999;">请先选择日期，系统将自动生成天数</p>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn btn-outline" onclick="closePlanModal()">取消</button>
                    <button type="submit" class="btn btn-primary" id="submitBtn">创建</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../js/common.js"></script>
    <script src="../js/mockData.js"></script>
    <script>
        let currentStatus = 'all';
        let plans = [...mockPlans];
        let editingPlanId = null;
        let currentDays = [];

        // 状态文本映射
        const statusText = {
            planning: '规划中',
            pending: '待进行',
            ongoing: '进行中',
            completed: '已完成'
        };

        // 活动类型
        const activityTypes = [
            '景点游览',
            '用餐',
            '交通',
            '住宿',
            '休息',
            '购物',
            '娱乐',
            '其他'
        ];

        // 初始化
        function init() {
            renderPlans();

            // 监听日期变化
            document.getElementById('planStartDate').addEventListener('change', generateDaysEditor);
            document.getElementById('planEndDate').addEventListener('change', generateDaysEditor);
        }

        // 生成每日行程编辑器
        function generateDaysEditor() {
            const startDate = document.getElementById('planStartDate').value;
            const endDate = document.getElementById('planEndDate').value;

            if (!startDate || !endDate) return;

            const start = new Date(startDate);
            const end = new Date(endDate);

            if (end < start) {
                showToast('结束日期不能早于出发日期', 'error');
                return;
            }

            const days = getDaysBetween(startDate, endDate);

            // 保存旧的行程数据
            const oldDays = [...currentDays];

            // 初始化天数数据
            currentDays = [];
            for (let i = 0; i < days; i++) {
                const date = new Date(start);
                date.setDate(date.getDate() + i);
                const dateStr = date.toISOString().split('T')[0];

                // 查找是否有旧数据
                const existingDay = oldDays.find(d => d.date === dateStr);

                if (existingDay) {
                    // 如果旧数据存在，确保有 activities 字段
                    currentDays.push({
                        date: dateStr,
                        dayNumber: i + 1,
                        activities: existingDay.activities || []
                    });
                } else {
                    // 创建新的空数据
                    currentDays.push({
                        date: dateStr,
                        dayNumber: i + 1,
                        activities: []
                    });
                }
            }

            renderDaysEditor();
        }

        // 渲染每日行程编辑器
        function renderDaysEditor() {
            const editor = document.getElementById('daysEditor');

            if (!currentDays || currentDays.length === 0) {
                editor.innerHTML = '<p style="text-align: center; color: #999;">请先选择日期，系统将自动生成天数</p>';
                return;
            }

            editor.innerHTML = currentDays.map((day, dayIndex) => {
                // 确保 activities 数组存在
                const activities = day.activities || [];

                return `
                    <div class="day-item">
                        <div class="day-header">
                            <div class="day-title">第 ${day.dayNumber} 天 - ${day.date}</div>
                            <button type="button" class="add-activity-btn" data-day-index="${dayIndex}">+ 添加活动</button>
                        </div>
                        <div class="activity-list" id="activityList${dayIndex}">
                            ${activities.length === 0
                                ? '<div class="empty-activities">暂无活动安排，点击上方按钮添加</div>'
                                : activities.map((activity, actIndex) => renderActivity(dayIndex, actIndex, activity)).join('')
                            }
                        </div>
                    </div>
                `;
            }).join('');

            // 绑定添加活动按钮事件
            editor.querySelectorAll('.add-activity-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const dayIndex = parseInt(this.getAttribute('data-day-index'));
                    addActivity(dayIndex);
                });
            });

            // 绑定删除活动按钮事件
            editor.querySelectorAll('.icon-btn-delete').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    const dayIndex = parseInt(this.getAttribute('data-day-index'));
                    const actIndex = parseInt(this.getAttribute('data-act-index'));
                    deleteActivity(dayIndex, actIndex);
                });
            });

            // 绑定时间输入事件
            editor.querySelectorAll('input[type="time"]').forEach(input => {
                input.addEventListener('change', function() {
                    const dayIndex = parseInt(this.getAttribute('data-day-index'));
                    const actIndex = parseInt(this.getAttribute('data-act-index'));
                    const field = this.getAttribute('data-field');
                    updateActivityTime(dayIndex, actIndex, field, this.value);
                });
            });

            // 绑定活动类型选择事件
            editor.querySelectorAll('.activity-type').forEach(select => {
                select.addEventListener('change', function() {
                    const dayIndex = parseInt(this.getAttribute('data-day-index'));
                    const actIndex = parseInt(this.getAttribute('data-act-index'));
                    updateActivityType(dayIndex, actIndex, this.value);
                });
            });

            // 绑定活动描述输入事件
            editor.querySelectorAll('.activity-desc').forEach(textarea => {
                textarea.addEventListener('change', function() {
                    const dayIndex = parseInt(this.getAttribute('data-day-index'));
                    const actIndex = parseInt(this.getAttribute('data-act-index'));
                    updateActivityDesc(dayIndex, actIndex, this.value);
                });
            });
        }

        // 渲染单个活动
        function renderActivity(dayIndex, actIndex, activity) {
            return `
                <div class="activity-item">
                    <div class="activity-header">
                        <div class="activity-time">
                            <input type="time" value="${activity.startTime}"
                                   data-day-index="${dayIndex}" data-act-index="${actIndex}" data-field="startTime">
                            <span>-</span>
                            <input type="time" value="${activity.endTime}"
                                   data-day-index="${dayIndex}" data-act-index="${actIndex}" data-field="endTime">
                        </div>
                        <div class="activity-actions">
                            <button type="button" class="icon-btn icon-btn-delete"
                                    data-day-index="${dayIndex}" data-act-index="${actIndex}" title="删除">×</button>
                        </div>
                    </div>
                    <div class="activity-content">
                        <select class="activity-type"
                                data-day-index="${dayIndex}" data-act-index="${actIndex}">
                            ${activityTypes.map(type =>
                                `<option value="${type}" ${activity.type === type ? 'selected' : ''}>${type}</option>`
                            ).join('')}
                        </select>
                        <textarea class="activity-desc" rows="2"
                                  placeholder="活动描述，例如：故宫博物院游览"
                                  data-day-index="${dayIndex}" data-act-index="${actIndex}">${activity.description || ''}</textarea>
                    </div>
                </div>
            `;
        }

        // 添加活动
        function addActivity(dayIndex) {
            // 确保 activities 数组存在
            if (!currentDays[dayIndex].activities) {
                currentDays[dayIndex].activities = [];
            }

            const lastActivity = currentDays[dayIndex].activities[currentDays[dayIndex].activities.length - 1];
            const startTime = lastActivity ? lastActivity.endTime : '09:00';
            const endTime = calculateEndTime(startTime, 120); // 默认2小时

            currentDays[dayIndex].activities.push({
                type: '景点游览',
                startTime: startTime,
                endTime: endTime,
                description: ''
            });

            renderDaysEditor();
        }

        // 计算结束时间
        function calculateEndTime(startTime, durationMinutes) {
            const [hours, minutes] = startTime.split(':').map(Number);
            const totalMinutes = hours * 60 + minutes + durationMinutes;
            const endHours = Math.floor(totalMinutes / 60) % 24;
            const endMinutes = totalMinutes % 60;
            return `${String(endHours).padStart(2, '0')}:${String(endMinutes).padStart(2, '0')}`;
        }

        // 更新活动时间
        function updateActivityTime(dayIndex, actIndex, field, value) {
            currentDays[dayIndex].activities[actIndex][field] = value;
        }

        // 更新活动类型
        function updateActivityType(dayIndex, actIndex, value) {
            currentDays[dayIndex].activities[actIndex].type = value;
        }

        // 更新活动描述
        function updateActivityDesc(dayIndex, actIndex, value) {
            currentDays[dayIndex].activities[actIndex].description = value;
        }

        // 删除活动
        function deleteActivity(dayIndex, actIndex) {
            showConfirm('确定要删除这个活动吗？', () => {
                currentDays[dayIndex].activities.splice(actIndex, 1);
                renderDaysEditor();
            });
        }

        // 渲染计划列表
        function renderPlans() {
            const grid = document.getElementById('plansGrid');
            let filteredPlans = plans;

            if (currentStatus !== 'all') {
                filteredPlans = plans.filter(p => p.status === currentStatus);
            }

            if (filteredPlans.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state" style="grid-column: 1/-1;">
                        <div style="font-size: 64px; margin-bottom: 20px;">📝</div>
                        <h3>暂无${currentStatus === 'all' ? '' : statusText[currentStatus]}计划</h3>
                        <p>开始创建您的第一个旅游计划吧！</p>
                        <button class="btn btn-primary" onclick="openNewPlanModal()">+ 新建计划</button>
                    </div>
                `;
                return;
            }

            grid.innerHTML = filteredPlans.map(plan => {
                const days = getDaysBetween(plan.startDate, plan.endDate);
                // 使用 data 属性存储 ID，避免引号问题
                return `
                    <div class="plan-card" data-plan-id="${plan.id}">
                        <div class="plan-header">
                            <div>
                                <div class="plan-title">${plan.title}</div>
                            </div>
                            <div class="plan-status status-${plan.status}">
                                ${statusText[plan.status]}
                            </div>
                        </div>
                        <div class="plan-meta">
                            <div class="plan-meta-item">
                                <span>📍</span>
                                <span>${plan.destination}</span>
                            </div>
                            <div class="plan-meta-item">
                                <span>📅</span>
                                <span>${plan.startDate} 至 ${plan.endDate} (${days}天)</span>
                            </div>
                            <div class="plan-meta-item">
                                <span>💰</span>
                                <span>预算：¥${plan.budget}</span>
                            </div>
                        </div>
                        <div class="plan-actions">
                            ${getActionButtons(plan)}
                        </div>
                    </div>
                `;
            }).join('');

            // 绑定计划卡片点击事件
            grid.querySelectorAll('.plan-card').forEach(card => {
                card.addEventListener('click', function(e) {
                    // 如果点击的是操作按钮区域，不触发卡片点击
                    if (e.target.closest('.plan-actions')) return;
                    const planId = this.getAttribute('data-plan-id');
                    viewPlanDetail(planId);
                });
            });

            // 绑定操作按钮事件
            grid.querySelectorAll('[data-action]').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.preventDefault();
                    e.stopPropagation();

                    const action = this.getAttribute('data-action');
                    const planId = this.getAttribute('data-plan-id');

                    switch(action) {
                        case 'edit':
                            editPlan(planId);
                            break;
                        case 'confirm':
                            confirmPlan(planId);
                            break;
                        case 'cancel':
                            cancelPlan(planId);
                            break;
                        case 'complete':
                            completePlan(planId);
                            break;
                        case 'delete':
                            deletePlan(planId);
                            break;
                        case 'view':
                            viewPlanDetail(planId);
                            break;
                    }
                });
            });
        }

        // 根据状态获取操作按钮
        function getActionButtons(plan) {
            switch (plan.status) {
                case 'planning':
                    return `
                        <button class="btn btn-primary" data-action="edit" data-plan-id="${plan.id}">编辑</button>
                        <button class="btn btn-secondary" data-action="confirm" data-plan-id="${plan.id}">确认计划</button>
                    `;
                case 'pending':
                    return `
                        <button class="btn btn-primary" data-action="edit" data-plan-id="${plan.id}">编辑</button>
                        <button class="btn btn-outline" data-action="cancel" data-plan-id="${plan.id}">取消</button>
                    `;
                case 'ongoing':
                    return `
                        <button class="btn btn-primary" data-action="view" data-plan-id="${plan.id}">查看详情</button>
                        <button class="btn btn-secondary" data-action="complete" data-plan-id="${plan.id}">标记完成</button>
                    `;
                case 'completed':
                    return `
                        <button class="btn btn-primary" data-action="view" data-plan-id="${plan.id}">查看详情</button>
                        <button class="btn btn-outline" data-action="delete" data-plan-id="${plan.id}">删除</button>
                    `;
                default:
                    return '';
            }
        }

        // 按状态过滤
        function filterByStatus(status) {
            currentStatus = status;

            // 更新标签样式
            document.querySelectorAll('.status-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            event.target.classList.add('active');

            renderPlans();
        }

        // 打开新建计划模态框
        function openNewPlanModal() {
            editingPlanId = null;
            currentDays = [];
            document.getElementById('modalTitle').textContent = '新建旅游计划';
            document.getElementById('submitBtn').textContent = '创建';
            document.getElementById('planModal').classList.add('active');
            document.querySelector('form').reset();

            // 设置默认日期为今天
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('planStartDate').value = today;
            document.getElementById('planPeople').value = 1;

            document.getElementById('daysEditor').innerHTML = '<p style="text-align: center; color: #999;">请先选择日期，系统将自动生成天数</p>';
        }

        // 编辑计划
        function editPlan(id) {
            // 转换 ID 类型以匹配
            editingPlanId = id;
            const plan = plans.find(p => p.id == id); // 使用 == 而不是 === 来兼容数字和字符串

            if (!plan) {
                console.error('计划未找到:', id, '可用计划:', plans);
                showToast('计划未找到', 'error');
                return;
            }

            document.getElementById('modalTitle').textContent = '编辑旅游计划';
            document.getElementById('submitBtn').textContent = '保存';
            document.getElementById('planTitle').value = plan.title;
            document.getElementById('planDestination').value = plan.destination;
            document.getElementById('planStartDate').value = plan.startDate;
            document.getElementById('planEndDate').value = plan.endDate;
            document.getElementById('planBudget').value = plan.budget;
            document.getElementById('planPeople').value = plan.people || 1;

            // 加载行程数据，确保数据格式正确
            if (plan.days && Array.isArray(plan.days)) {
                // 转换旧格式数据为新格式
                currentDays = plan.days.map((day, index) => ({
                    date: day.date || plan.startDate,
                    dayNumber: day.dayNumber || (index + 1),
                    activities: day.activities || []
                }));
            } else {
                currentDays = [];
            }

            // 计算实际应该有多少天
            const expectedDays = getDaysBetween(plan.startDate, plan.endDate);

            // 如果没有行程数据，或者天数不匹配，重新生成
            if (currentDays.length === 0 || currentDays.length !== expectedDays) {
                generateDaysEditor();
            } else {
                renderDaysEditor();
            }

            document.getElementById('planModal').classList.add('active');
        }

        // 关闭计划模态框
        function closePlanModal() {
            document.getElementById('planModal').classList.remove('active');
            document.querySelector('form').reset();
            editingPlanId = null;
            currentDays = [];
        }

        // 保存计划（新建或编辑）
        async function savePlan(event) {
            event.preventDefault();

            const title = document.getElementById('planTitle').value;
            const destination = document.getElementById('planDestination').value;
            const startDate = document.getElementById('planStartDate').value;
            const endDate = document.getElementById('planEndDate').value;
            const budget = parseInt(document.getElementById('planBudget').value);
            const people = parseInt(document.getElementById('planPeople').value);

            // 验证日期
            if (new Date(endDate) < new Date(startDate)) {
                showToast('结束日期不能早于出发日期', 'error');
                return;
            }

            if (editingPlanId != null) {
                // 编辑模式 - 使用 != 来兼容数字和字符串
                showToast('正在保存修改...', 'info');
                await delay(1000);

                const plan = plans.find(p => p.id == editingPlanId);
                if (plan) {
                    plan.title = title;
                    plan.destination = destination;
                    plan.startDate = startDate;
                    plan.endDate = endDate;
                    plan.budget = budget;
                    plan.people = people;
                    plan.days = currentDays;
                    showToast('计划修改成功！', 'success');
                }
            } else {
                // 新建模式
                showToast('正在创建计划...', 'info');
                await delay(1000);

                const newPlan = {
                    id: generateId(),
                    title,
                    destination,
                    startDate,
                    endDate,
                    budget,
                    people,
                    status: 'planning',
                    createdAt: formatDate(new Date()),
                    days: currentDays
                };

                plans.unshift(newPlan);
                showToast('计划创建成功！', 'success');
            }

            closePlanModal();
            renderPlans();
        }

        // 查看计划详情
        function viewPlanDetail(id) {
            showToast('跳转到计划详情页', 'info');
        }

        // 确认计划
        async function confirmPlan(id) {
            showToast('正在确认计划...', 'info');
            await delay(800);

            const plan = plans.find(p => p.id == id);
            if (plan) {
                plan.status = 'pending';
                renderPlans();
                showToast('计划已确认！', 'success');
            }
        }

        // 取消计划
        function cancelPlan(id) {
            showConfirm('确定要取消这个计划吗？', () => {
                const plan = plans.find(p => p.id == id);
                if (plan) {
                    plan.status = 'planning';
                    renderPlans();
                    showToast('计划已取消', 'success');
                }
            });
        }

        // 完成计划
        async function completePlan(id) {
            showConfirm('确认完成这个计划吗？完成后将自动生成足迹。', async () => {
                showToast('正在标记完成...', 'info');
                await delay(800);

                const plan = plans.find(p => p.id == id);
                if (plan) {
                    plan.status = 'completed';
                    renderPlans();
                    showToast('计划已完成！足迹已自动生成', 'success');
                }
            });
        }

        // 删除计划
        function deletePlan(id) {
            showConfirm('确定要删除这个计划吗？此操作不可恢复。', () => {
                plans = plans.filter(p => p.id != id);
                renderPlans();
                showToast('计划已删除', 'success');
            });
        }

        // 点击模态框背景关闭
        document.getElementById('planModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closePlanModal();
            }
        });

        // 页面加载完成后初始化
        init();
    </script>
</body>
</html>
